app-id: io.github.matko802.Musishark
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
  - org.freedesktop.Sdk.Extension.rust-stable
command: musishark
build-options:
  append-path: /usr/lib/sdk/node24/bin:/usr/lib/sdk/rust-stable/bin
  env:
    NODEJS_DIR: /usr/lib/sdk/node24
    FLATPAK_ENABLE_SDK_EXT: node24,rust-stable
    CARGO_HOME: /run/build/musishark/cargo
  build-args:
    - --share=network
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --persist=.
  - --device=dri
  - --socket=session-bus
  - --filesystem=xdg-music
  - --filesystem=xdg-run/app/com.discordapp.Discord
  - --filesystem=xdg-run/discord-ipc-0
modules:
  - name: nodejs-runtime
    buildsystem: simple
    build-options:
      no-debuginfo: true
    build-commands:
      - install -Dm755 /usr/lib/sdk/node24/bin/node ${FLATPAK_DEST}/bin/node
      - cp -ra /usr/lib/sdk/node24/lib ${FLATPAK_DEST}/ || true
    sources: []

  - name: yt-dlp
    buildsystem: simple
    build-options:
      no-debuginfo: true
    build-commands:
      - pip3 install --prefix=${FLATPAK_DEST} --no-cache-dir --upgrade "yt-dlp[default]"
      - pip3 install --prefix=${FLATPAK_DEST} --no-cache-dir "yt-dlp-ejs"
    sources: []

  - name: musishark
    buildsystem: simple
    build-commands:
      - cargo build --release --locked
      - install -Dm755 target/release/musishark ${FLATPAK_DEST}/bin/musishark
      - install -Dm644 io.github.matko802.Musishark.desktop ${FLATPAK_DEST}/share/applications/io.github.matko802.Musishark.desktop
      - install -Dm644 io.github.matko802.Musishark.metainfo.xml ${FLATPAK_DEST}/share/metainfo/io.github.matko802.Musishark.metainfo.xml
      - install -Dm644 assets/icons/hicolor/512x512/apps/io.github.matko802.Musishark.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/io.github.matko802.Musishark.png
      - install -Dm644 assets/icons/hicolor/512x512/apps/io.github.matko802.Musishark-dark.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/io.github.matko802.Musishark-dark.png
      - install -Dm644 assets/icons/hicolor/512x512/apps/io.github.matko802.Musishark-light.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/io.github.matko802.Musishark-light.png
      - install -Dm644 assets/icons/hicolor/symbolic/apps/io.github.matko802.Musishark-symbolic.svg ${FLATPAK_DEST}/share/icons/hicolor/symbolic/apps/io.github.matko802.Musishark-symbolic.svg
    sources:
      - type: dir
        path: .
        skip:
          - .venv
          - .git
          - .ccache
          - build-dir
          - .flatpak-builder
          - target
          - target-prof
          - fixtures
          - data
