[package]
name = "musishark"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "A modern, Linux-first YouTube Music player"
default-run = "musishark"

[[bin]]
name = "musishark"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
cairo-rs = "0.22"
glib = "0.22"
gio = "0.22"
gst = { package = "gstreamer", version = "0.25", features = ["v1_24"] }
gst-audio = { package = "gstreamer-audio", version = "0.25", features = ["v1_24"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "form", "query", "gzip", "charset", "system-proxy"] }
async-channel = "2"
ytmusicapi = "0.5"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
md-5 = "0.10"
regex = "1"


tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
rusqlite = "0.40"
lofty = "0.24"
roxmltree = "0.21"
unicode-normalization = "0.1"
kakasi = "0.1"
pinyin = { version = "0.11", default-features = false, features = ["with_tone"] }
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "webp"] }

webkit6 = { version = "0.6", features = ["v2_44"] }
rustypipe-botguard = "0.1.2"
libc = "0.2"
mpris-server = { version = "0.10", features = ["tokio"] }

[build-dependencies]
glib-build-tools = "0.22"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[dev-dependencies]
tempfile = "3.27.0"
